[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxytool"
version = "1!0.0.1795217351"
description = "common proxy functions"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
dependencies = [
    "click",
    "asserttool @ git+https://github.com/jakeogh/asserttool@4bd23a06c2161e488415acde89c29537e6720cc1",
    "click-auto-help @ git+https://github.com/jakeogh/click-auto-help@3bddf633cb62ada70968ac16aea5a6c484e6459b",
    "clicktool @ git+https://github.com/jakeogh/clicktool@fe263331c27a4b392ce04261d83267759098d6b7",
]
license = "ISC"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/jakeogh/proxytool"

[project.scripts]
proxytool = "proxytool.proxytool:cli"

[tool.setuptools]
include-package-data = true
zip-safe = false
packages = ["proxytool"]

[tool.setuptools.package-data]
proxytool = [
    "py.typed",
]
